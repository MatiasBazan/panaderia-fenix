server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 30M;

    # Cabeceras de seguridad (aplican a toda respuesta, incluidas redirecciones/errores).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # frame-src habilita el iframe del mapa de Google en la landing.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Fotos de producto: viven en el volumen app_storage (storage/app/public),
    # montado read-only en este contenedor. Se sirven directo, sin pasar por PHP.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Assets compilados por Vite: cache largo e inmutable.
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Mantenimiento: si php-fpm no contesta (deploy, migraciones, contenedor
    # recreándose) o si Laravel devuelve 503 por `artisan down`, sale la misma
    # pantalla en vez del error crudo del proxy. El 502/504 se reescribe a 503
    # para que buscadores y monitoreo lo lean como "volvé más tarde".
    fastcgi_intercept_errors on;
    error_page 502 503 504 =503 /mantenimiento.html;

    # Sin add_header propio a propósito: nginx pisa los heredados apenas el
    # bloque declara uno, y las cabeceras de seguridad de arriba tienen que
    # seguir valiendo también para esta respuesta.
    location = /mantenimiento.html {
        internal;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
        fastcgi_read_timeout 120;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
