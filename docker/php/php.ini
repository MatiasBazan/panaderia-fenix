; Config PHP producción — Panadería Fénix
; memory_limit holgado: Intervention/GD procesa y convierte fotos a WebP.
memory_limit = 512M

; Subida de fotos de producto (el admin sube el original, se optimiza en el server).
upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 120
expose_php = Off

; OPcache (perf en prod: código congelado, sin revalidar timestamps)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
